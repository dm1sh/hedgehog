name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          RUN_NUM="${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION_CODE=$(( 100000000 + 10#${RUN_NUM} ))
            VERSION_NAME="manual"
            RELEASE_TAG="manual"
            RELEASE_NAME="manual"
            IS_PRERELEASE="true"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              X="${BASH_REMATCH[1]}"
              Y="${BASH_REMATCH[2]}"
              Z="${BASH_REMATCH[3]}"
              VERSION_CODE=$(( 10#$X * 1000000 + 10#$Y * 10000 + 10#$Z * 100 + 10#${RUN_NUM} ))
              VERSION_NAME="${X}.${Y}.${Z}"
              RELEASE_TAG="$TAG_NAME"
              RELEASE_NAME="$TAG_NAME"
              IS_PRERELEASE="false"
            else
              echo "Error: Tag '$TAG_NAME' does not match format vX.Y.Z" >&2
              exit 1
            fi
          fi
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION_NAME=${VERSION_NAME}, VERSION_CODE=${VERSION_CODE}, RELEASE_TAG=${RELEASE_TAG}, IS_PRERELEASE=${IS_PRERELEASE}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache minimal FFmpeg + libopus JNI libraries
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            cli/src/main/resources/NATIVE
          key: jni-opus-ffmpeg-v3-${{ hashFiles('app/src/main/cpp/**', 'scripts/build-opus-ffmpeg-android.sh', 'scripts/build-opus-ffmpeg-linux.sh') }}

      - name: Build minimal FFmpeg + libopus JNI libraries (Android & Linux CLI)
        run: |
          chmod +x scripts/build-opus-ffmpeg-android.sh scripts/build-opus-ffmpeg-linux.sh
          ./scripts/build-opus-ffmpeg-android.sh
          ./scripts/build-opus-ffmpeg-linux.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/hedgehog-signing.p12
          fi

      - name: Build Release APK and Linux CLI
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SIGNING_KEYSTORE_PATH: /tmp/hedgehog-signing.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease :cli:executableCli --stacktrace

      - name: Prepare Release Artifacts
        id: apk
        run: |
          set -euo pipefail
          APK_FILE="hedgehog-${{ steps.version.outputs.version_name }}.apk"
          CLI_FILE="hedgehog-cli"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          cp cli/build/libs/hedgehog-cli "$CLI_FILE"
          chmod +x "$CLI_FILE"
          echo "apk_file=${APK_FILE}" >> "$GITHUB_OUTPUT"
          echo "cli_file=${CLI_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hedgehog-release-apk
          path: |
            ${{ steps.apk.outputs.apk_file }}
            ${{ steps.apk.outputs.cli_file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          APK_FILE: ${{ steps.apk.outputs.apk_file }}
          CLI_FILE: ${{ steps.apk.outputs.cli_file }}
        run: |
          set -euo pipefail
          NOTES="Version: ${VERSION_NAME} (versionCode: ${VERSION_CODE})"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            fi
            gh release create "$RELEASE_TAG" "$APK_FILE" "$CLI_FILE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "$NOTES" \
              --prerelease
          else
            if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$APK_FILE" "$CLI_FILE" --clobber
            else
              gh release create "$RELEASE_TAG" "$APK_FILE" "$CLI_FILE" \
                --title "$RELEASE_NAME" \
                --notes "$NOTES" \
                --generate-notes
            fi
          fi
